<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="robots" content="noindex">
<!-- Sumber gambar Open Graph. Buka lewat server statis lalu potret 1200x630 → assets/img/og.png -->
<link rel="stylesheet" href="assets/css/style.css">
<style>
 html,body{margin:0;width:1200px;height:630px;overflow:hidden}
 .og{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:30px;padding:56px 56px 56px 64px;
     background:radial-gradient(900px 500px at 8% -10%,#dce8ff,transparent 60%),radial-gradient(700px 500px at 100% 100%,#eef3ff,transparent 60%),#fcfbf7}
 .og h1{font-size:57px;line-height:1.05;margin:14px 0 18px;letter-spacing:-.03em}
 .og p{font-size:21px;color:var(--ink-soft);margin:0 0 26px;max-width:26ch}
 .badge{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue-700)}
 .brand-og{display:flex;align-items:center;gap:12px;font-weight:800;font-size:27px}
 .brand-og img{width:48px;height:48px}
 .pill{display:inline-flex;gap:9px;align-items:center;background:#16a34a;color:#fff;font-weight:700;padding:13px 22px;border-radius:999px;font-size:18px}
 .shots{position:relative;height:100%}
 .shots img{position:absolute;width:420px;border-radius:12px;border:1px solid rgba(14,31,63,.1);box-shadow:0 26px 50px -22px rgba(14,31,63,.6)}
 .s1{top:24px;left:20px;transform:rotate(-4deg)}
 .s2{top:150px;left:100px;transform:rotate(2.5deg)}
 .s3{top:280px;left:40px;transform:rotate(-1.5deg)}
 .plane-og{position:absolute;right:48px;top:36px;width:92px;color:var(--blue-700)}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><symbol id="i-plane" viewBox="0 0 120 120">
 <path d="M8 58 112 10 78 112 58 74 8 58z" fill="#fff" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
 <path d="M112 10 58 74l20 38L112 10z" fill="#dce8ff" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/></symbol></svg>
<div class="og">
  <div>
    <div class="brand-og"><img src="assets/img/logo-yubuild.svg" alt="">Yubuild</div>
    <h1>Website yang bikin calon pelanggan berhenti ragu.</h1>
    <p>Landing page, company profile, sampai aplikasi kasir &amp; absensi.</p>
    <span class="pill">10 karya nyata · 0857-7421-890</span>
  </div>
  <div class="shots">
    <img class="s1" src="assets/img/karya/ayomancing-thumb.webp" alt="">
    <img class="s2" src="assets/img/karya/pracaya-dashboard-thumb.webp" alt="">
    <img class="s3" src="assets/img/karya/bengkellas-thumb.webp" alt="">
  </div>
  <svg class="plane plane-og" viewBox="0 0 120 120"><use href="#i-plane"/></svg>
</div></body></html>
